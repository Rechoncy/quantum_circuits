[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-solver"
version = "0.1.0"
description = "Multi-backend quantum circuit evolution solver (QuTiP, Kraus, Stim) and hardware-aware optimal circuit synthesizer"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "qutip>=5.0",
    "stim>=1.12",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "qutip-qip>=0.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["quantum_solver*"]
